name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Read from `.nvmrc` rather than repeating the version here. That file
          # is managed by Preflight, and until now nothing enforced it — CI could
          # drift from the declared Node version with no failure to point at.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Fails if a file Preflight manages has diverged without this repo saying
      # so. To keep a local change, declare the file in `unmanaged` in
      # preflight.config.ts — that makes the divergence a reviewable decision
      # rather than drift. Runs before the tests because it is fast and its
      # failure is unambiguous.
      - name: Check for config drift
        run: pnpm exec preflight check

      # No job ran eslint until now, in this repo or in uxlab — which is how
      # uxlab accumulated 60 errors on develop while every check stayed green.
      # A green checks list said nothing about lint.
      #
      # Placed here for the same reason the drift check is: fast, and its
      # failure is unambiguous. It needs nothing beyond the install above,
      # because `eslint.config.mjs` imports `./.nuxt/eslint.config.mjs` and
      # `postinstall` runs `nuxt prepare`. That is also why this is a step in
      # the existing job rather than a job of its own — a separate job would
      # repeat both the install and the prepare to gain nothing.
      - name: Run lint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Generate coverage report
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
