name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Fails if a file Preflight manages has diverged without this repo saying
      # so. To keep a local change, declare the file in `unmanaged` in
      # preflight.config.ts — that makes the divergence a reviewable decision
      # rather than drift. Runs before the tests because it is fast and its
      # failure is unambiguous.
      - name: Check for config drift
        run: pnpm exec preflight check

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Generate coverage report
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
