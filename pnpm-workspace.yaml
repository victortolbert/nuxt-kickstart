# pnpm 11 settings (migrated from .npmrc).
# autoInstallPeers is the default since pnpm 8 — set explicitly so peer deps
# are resolved automatically and never need to be declared in package.json.
# shamefully-hoist was removed: previously-phantom deps (h3,
# vitest-environment-nuxt) are now declared directly in package.json, so the
# strict (non-flattened) node_modules layout resolves everything correctly.
autoInstallPeers: true
strictPeerDependencies: false

overrides:
  serialize-javascript: ^7.1.2
  # @nuxt/icon arrives transitively via @nuxt/ui (which asks for ^2.3.1) and
  # resolved to 2.5.0, whose Nuxt plugin does `_api.setFetch($fetch.native)`.
  # On the server `useRequestFetch()` returns Nitro's `event.$fetch`, a plain
  # arrow function with no `.native`, so Iconify's fetch was set to undefined
  # and every SSR/prerender icon load aborted (424) before making a request —
  # ~652 `[Icon] failed to load icon` warnings per build. 2.5.1 falls back to
  # `globalThis.$fetch.native` (Nitro's localFetch), which resolves the
  # relative /api/_nuxt_icon URL in-process against the local collections.
  # Pinned here rather than as a direct dependency so every transitive copy
  # gets the fix. Drop once @nuxt/ui requires >=2.5.1 itself. See issue #21.
  '@nuxt/icon': ^2.5.1

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  maplibre-gl: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

# pnpm 11 defaults minimumReleaseAge to 1440 minutes / 24h (supply-chain guard).
# It is NOT set anywhere in this repo or on the machine — it is pnpm's own
# default, which also makes it non-strict: per pnpm's docs, minimumReleaseAgeStrict
# defaults to false unless minimumReleaseAge is configured explicitly. So writing
# `minimumReleaseAge: 1440` here to "document current behaviour" would make it
# stricter than it is today. Don't.
#
# Both forms match, measured against pnpm 11.20.0: a bare name exempts every
# version of the package, `name@version` exempts only that one. Prefer the
# versioned form — it stops applying the moment the package moves on.
# The bare entries below exempt the 2026-06-12 dependency update and are now
# prunable; the versioned ones are pinned to what the lockfile resolves.
minimumReleaseAgeExclude:
  # Deliberate exception to the versioned-form preference above. Preflight is
  # first-party — we publish it — so the cooldown protects against nothing here
  # and only delays adopting our own releases by a day. Every future version
  # should be exempt too, which is exactly what the bare form means.
  - '@victortolbert/preflight'

