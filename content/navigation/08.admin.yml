# Admin navigation group - requires admin role
# Visible only to authenticated users with admin role

id: admin
label: Admin
icon: shield
hidden: false
order: 8
section: footer # pinned to the bottom of the sidebar
defaultOpen: false
requiresAuth: true
requiresRole: admin

items:
  - slug: dashboard
    label: Dashboard
    icon: layoutDashboard
    path: /app/admin

  - slug: users
    label: Users
    icon: users
    path: /app/admin/users

  - slug: email
    label: Email
    icon: mail
    children:
      - slug: email-compose
        label: Compose
        icon: mailForward
        path: /app/admin/email/compose

      - slug: email-drafts
        label: Drafts
        icon: fileText
        path: /app/admin/email/drafts

      - slug: email-lists
        label: Lists
        icon: users
        path: /app/admin/email/lists

      - slug: email-analytics
        label: Analytics
        icon: chartBar
        path: /app/admin/email/analytics

      - slug: email-templates
        label: Templates
        icon: code
        path: /app/admin/email/templates

  - slug: trash
    label: Trash
    icon: trash
    path: /app/admin/trash
